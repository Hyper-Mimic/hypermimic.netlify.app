<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Update Available</title>
    <meta name="robots" content="noindex">
    <meta charset="utf-8">
    <noscript><meta http-equiv="Refresh" content="0; url=https://hypermimic.netlify.app/desktop/#download"></noscript>
    <style>
      @media (prefers-color-scheme: dark) {
        :root {
          background: #171717;
          color-scheme: dark;
        }
      }
    </style>
  </head>
  <body>
    <script>
      function redirectRelease () {
        // This site's root is the editor, not the desktop download page (upstream TurboWarp
        // serves the desktop page from /, which is why this used to be '/').
        // Jump straight to the download section.
        location.replace('/desktop/#download');
      }

      function redirectBeta () {
        location.replace('https://github.com/Hyper-Mimic/desktop/releases');
      }

      try {
        var params = new URLSearchParams(location.search);
        if (params.has('to') && params.get('to').includes('-')) {
          redirectBeta();
        } else {
          redirectRelease();
        }
      } catch (e) {
        redirectRelease();
      }
    </script>
  </body>
</html>
